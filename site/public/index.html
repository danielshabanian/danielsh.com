<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0C0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Apply a saved theme choice before first paint (Auto follows the system).
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  document.documentElement.classList.add("js");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");
  // If the animation layer never starts (CDN blocked), show everything anyway.
  setTimeout(function () { if (!window.__animReady) document.documentElement.classList.remove("motion"); }, 3000);
</script>
